# Application Properties - Base (non-sensitive, committed to git)
spring.application.name=queuecut-backend

# Active profile — override with SPRING_PROFILES_ACTIVE env var in production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# SSE timeout (30 minutes)
spring.mvc.async.request-timeout=1800000

# Logging
logging.level.com.queuecut=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Security & App Defaults (overridden by env vars in prod)
jwt.secret=${JWT_SECRET:local-dev-jwt-secret-minimum-32-characters-long-queuecut-dev}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
barber.initial-password=${BARBER_INITIAL_PASSWORD:arslan123}

