# Server Port (injected by Render via $PORT)
server.port=${PORT:8080}

# Database — PostgreSQL (Render / Supabase / Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (optimized for Render free tier)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate — PostgreSQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway — enabled for production
spring.flyway.enabled=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS (accepts Netlify frontend domain and local development)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.netlify.app,http://localhost:5173}

# Barber initial password
barber.initial-password=${BARBER_INITIAL_PASSWORD}

# No SQL logging in production
spring.jpa.show-sql=false
logging.level.com.queuecut=INFO
